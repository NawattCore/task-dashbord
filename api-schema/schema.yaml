          format: date-time
      - in: query
        name: created_to
        schema:
          type: string
          format: date-time
      - in: query
        name: is_contacted
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product__is_available
        schema:
          type: boolean
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - awaiting-list
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAwaitingListProductsRetrieveList'
          description: ''
    post:
      operationId: awaiting_list_create
      tags:
      - awaiting-list
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwaitingListProductsCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AwaitingListProductsCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AwaitingListProductsCreate'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwaitingListProductsCreate'
          description: ''
